<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#FBFAF7">
<title>澳洲 11.24–12.11 行程地图</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <header class="head">
    <h1>澳洲 11.24 – 12.11 行程地图</h1>
    <p id="subtitle">悉尼 → 凯恩斯 → 阿德莱德 → 墨尔本 · 点日期看路线 · 点地点/路段在地图上定位 · “导航”打开 Google Maps</p>
  </header>
  <nav class="tabs" id="tabs" aria-label="日期"></nav>
  <section class="content" id="content"></section>
  <main class="mapwrap" id="mapwrap">
    <div id="map" aria-label="行程地图"></div>
    <div class="resizer" id="resizer" role="separator" aria-orientation="horizontal" aria-label="上下拖动调整地图高度" title="上下拖动调整地图高度；轻点在两种高度间切换"><span></span></div>
    <div class="legend" id="legend"></div>
    <div id="tip" role="tooltip"></div>
  </main>
</div>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="data.js"></script>
<script src="cairns.js"></script>
<script src="adelaide.js"></script>
<script src="melbourne.js"></script>
<script src="app.js"></script>
</body>
</html>
