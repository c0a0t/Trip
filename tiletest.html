<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>底图测试</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
  body{margin:0;padding:12px 16px 24px;font:15px/1.5 -apple-system,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;background:#FBFAF7;color:#1F2328}
  h1{font-size:18px;margin:4px 0}
  p{margin:4px 0 12px;color:#5A5F66;font-size:13.5px}
  .box{border:1px solid #DDD8CE;border-radius:12px;background:#fff;margin:0 0 14px;overflow:hidden}
  .hd{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;font-weight:600}
  .st{font-weight:600;white-space:nowrap}
  .st.ok{color:#1E7B3A}.st.bad{color:#B42318}.st.wait{color:#8A6D1E}
  .m{height:170px}
  #sum{font-size:16px;font-weight:600;padding:10px 12px;border-radius:10px;background:#F1EEE6;margin-bottom:14px}
  a{color:#1A5FB4}
</style>
</head>
<body>
<h1>底图测试（悉尼歌剧院一带）</h1>
<p>等 15 秒左右，看下面每个地图有没有显示街道，然后把这一页截图发给我。</p>
<div id="sum">测试中…</div>
<div id="list"></div>
<p><a href="./">← 回到行程地图</a></p>
<script src="vendor/leaflet/leaflet.js"></script>
<script>
const PROV=[
  {k:"osm",n:"① OpenStreetMap（现在默认用的）",url:"https://tile.openstreetmap.org/{z}/{x}/{y}.png"},
  {k:"esri",n:"② Esri 街道图（自动替换用的）",url:"https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}"},
  {k:"osmde",n:"③ OpenStreetMap 德国镜像",url:"https://tile.openstreetmap.de/{z}/{x}/{y}.png"}
];
const res={},list=document.getElementById("list"),sum=document.getElementById("sum");
function showSum(){
  const done=PROV.filter(p=>res[p.k].state!=="wait").length;
  sum.textContent=done<PROV.length?`测试中… ${done}/${PROV.length}`:"结果："+PROV.map(p=>`${p.n.slice(0,1)} ${res[p.k].state==="ok"?"能用":"不能用"}`).join("　");
}
PROV.forEach(p=>{
  const box=document.createElement("div");box.className="box";
  box.innerHTML=`<div class="hd"><span>${p.n}</span><span class="st wait">加载中…</span></div><div class="m"></div>`;
  list.appendChild(box);
  const st=box.querySelector(".st"),r=res[p.k]={state:"wait",ok:0,bad:0,t0:performance.now()};
  const set=(s,txt)=>{r.state=s;st.className="st "+s;st.textContent=txt;showSum()};
  const m=L.map(box.querySelector(".m"),{zoomControl:false,attributionControl:false}).setView([-33.8580,151.2140],15);
  const lay=L.tileLayer(p.url,{maxZoom:19}).addTo(m);
  lay.on("tileload",()=>{r.ok++;if(r.state!=="ok")set("ok",`✅ 能用（${((performance.now()-r.t0)/1000).toFixed(1)} 秒）`)});
  lay.on("tileerror",()=>{r.bad++;if(r.state==="wait"&&r.bad>=4)set("bad","❌ 加载失败")});
  setTimeout(()=>{if(r.state==="wait")set("bad","❌ 15 秒内没加载出来")},15000);
});
showSum();
</script>
</body>
</html>
